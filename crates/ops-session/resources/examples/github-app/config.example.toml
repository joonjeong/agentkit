[github_app]
app_id = 123456
private_key_path = "/home/me/.config/ops-session/github-app.private-key.pem"
api_url = "https://api.github.com"
default_profile = "codex-review"

# A single node can host multiple agents. Give each agent a distinct profile
# and set OPS_SESSION_GITHUB_PROFILE in that agent's service environment.

[github_app.profiles.codex-review]
repos = ["OWNER/REPO"]

[github_app.profiles.codex-review.permissions]
contents = "read"
pull_requests = "read"
issues = "read"

[github_app.profiles.codex-maintainer]
repos = ["OWNER/REPO"]

[github_app.profiles.codex-maintainer.permissions]
contents = "write"
pull_requests = "write"
issues = "write"

[github_app.profiles.hermes-release]
repos = ["OWNER/RELEASE-REPO", "OWNER/INFRA-REPO"]
installation_id = 987654

[github_app.profiles.hermes-release.permissions]
contents = "write"
pull_requests = "write"
actions = "write"
