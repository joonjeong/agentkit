[github_app]
app_id = 123456
api_url = "https://api.github.com"
default_profile = "codex-review"

# Runs read user config first, then /etc/ops-session/config.toml.
# For shared agent hosts, place private keys under /etc/ops-session/secrets
# with permissions such as root:ops-agent 0640, and run agents as users in
# that group.

[github_app.profiles.codex-review]
repos = ["OWNER/REPO"]

[github_app.profiles.codex-review.private_key]
type = "file"
path = "/etc/ops-session/secrets/codex-review-github-app.private-key.pem"

[github_app.profiles.codex-review.permissions]
contents = "read"
pull_requests = "read"
issues = "read"

[github_app.profiles.codex-maintainer]
repos = ["OWNER/REPO"]

[github_app.profiles.codex-maintainer.private_key]
type = "file"
path = "/etc/ops-session/secrets/codex-maintainer-github-app.private-key.pem"

[github_app.profiles.codex-maintainer.permissions]
contents = "write"
pull_requests = "write"
issues = "write"

[github_app.profiles.hermes-release]
repos = ["OWNER/RELEASE-REPO", "OWNER/INFRA-REPO"]
installation_id = 987654

[github_app.profiles.hermes-release.private_key]
type = "command"
command = "/usr/bin/op"
args = ["read", "op://ops/github-apps/hermes-release/private-key"]

[github_app.profiles.hermes-release.permissions]
contents = "write"
pull_requests = "write"
actions = "write"
